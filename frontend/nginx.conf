# /admin 은 앱 셸일 뿐이라 데이터는 없지만(관리자 API 는 전부 admin 세션 필요) 색인은 막는다.
# try_files 가 응답을 location / 에서 만들므로 헤더도 거기서 붙인다. 빈 값이면 nginx 가 생략한다
map $request_uri $robots_tag {
    default   "";
    ~^/admin  "noindex, nofollow";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /robots.txt {
        add_header Content-Type text/plain;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        return 200 "User-agent: *\nDisallow: /admin\nDisallow: /api/\n";
    }

    # 앱 셸은 항상 최신으로. /api/ 에는 붙이지 않는다
    # (server 블록에 두면 이미지 응답에도 no-store 가 상속되어 캐시가 무력화된다)
    location / {
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag $robots_tag;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri /index.html;     # /project/12 · /admin 같은 주소도 앱 셸로 (SPA 라우팅)
    }

    location /mcp {
        rewrite ^/mcp/?$ /oauth-server/ break;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        # $host 는 포트를 떼므로 MCP_ALLOWED_HOSTS 검사가 어긋난다. 원본 Host 를 그대로 넘긴다
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;             # MCP 는 스트리밍 응답을 쓴다
        proxy_read_timeout 1h;
    }

    # OAuth 공개 경로는 backend 안의 MCP SDK 앱으로 연결한다.
    location ~ ^/(authorize|token|register|revoke)$ {
        rewrite ^/(.*)$ /oauth-server/$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /.well-known/oauth-authorization-server {
        proxy_pass http://backend:8000/oauth-server/.well-known/oauth-authorization-server;
        proxy_set_header Host $http_host;
    }

    location = /.well-known/oauth-protected-resource/mcp {
        proxy_pass http://backend:8000/oauth-server/.well-known/oauth-protected-resource/mcp;
        proxy_set_header Host $http_host;
    }

    # 경로 없는 메타데이터를 먼저 찾는 클라이언트도 같은 MCP resource 문서를 받는다.
    location = /.well-known/oauth-protected-resource {
        proxy_pass http://backend:8000/oauth-server/.well-known/oauth-protected-resource/mcp;
        proxy_set_header Host $http_host;
    }

    location /oauth/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        client_max_body_size 10m;   # 이미지 업로드
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # 로그인 시도 제한이 실제 접속 IP 를 보게 한다 (클라이언트가 보낸 값은 덮어쓴다)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
