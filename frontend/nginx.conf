server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 앱 셸은 항상 최신으로. /api/ 에는 붙이지 않는다
    # (server 블록에 두면 이미지 응답에도 no-store 가 상속되어 캐시가 무력화된다)
    location / {
        add_header Cache-Control "no-store";
    }

    location /mcp {
        rewrite ^/mcp$ /mcp/ break;     # 슬래시 없는 주소도 그대로 받는다 (리다이렉트 없이)
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        # $host 는 포트를 떼므로 MCP_ALLOWED_HOSTS 검사가 어긋난다. 원본 Host 를 그대로 넘긴다
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;             # MCP 는 스트리밍 응답을 쓴다
        proxy_read_timeout 1h;
    }

    location /api/ {
        client_max_body_size 10m;   # 이미지 업로드
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
