<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>얼개 플래너</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: 'Segoe UI', 'Malgun Gothic', sans-serif; background: #f4f4f2; color: #333; }
  header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px;
    padding: 12px 24px; background: #fff; border-bottom: 1px solid #e5e5e0; }
  .hgroup { display: flex; align-items: center; gap: 10px; }
  .hgroup > *, .tabs > *, .viewtoggle > * { flex: none; }
  .tabs, .viewtoggle { display: flex; gap: 6px; }
  header button, #proj-name, #impfilter { white-space: nowrap; }
  .hgroup.right { justify-content: flex-end; }
  header h1 { font-size: 18px; display: flex; align-items: center; color: #444; }
  #proj-name { white-space: nowrap; font-size: 15px; font-weight: 700; color: #444;
    padding: 4px 8px; border-radius: 6px; }
  #proj-name.editable { cursor: text; }
  #proj-name.editable:hover { background: #f2f2ef; }
  .ibtn { display: inline-flex; align-items: center; justify-content: center;
    width: 42px; height: 36px; padding: 0 !important; flex: none; }
  .ibtn svg { flex: none; }
  .logo-btn { width: 48px; height: 38px; }
  .logo-btn img { display: block; }
  .ibtn.plain { border-color: transparent; background: transparent; cursor: default; }
  .ghost { border: 1px dashed #cfcfc8 !important; background: rgba(255,255,255,.5) !important;
    color: #b0b0a8; box-shadow: none !important; font-size: 13px; }
  .ghost:hover { color: #555; border-color: #9a9a93 !important; background: #fff !important; }
  .dir-ghost { color: #b0b0a8; border: 1px dashed #d8d8d2; border-radius: 6px; margin: 8px 0 4px;
    justify-content: center; font-size: 13px; }
  .dir-ghost:hover { color: #555; border-color: #9a9a93; }
  .tabs button, .viewtoggle button {
    border: 1px solid #ddd; background: #fff; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 14px;
  }
  .tabs button.active, .viewtoggle button.active { background: #333; color: #fff; border-color: #333; }
  main { display: flex; height: calc(100vh - 57px); }
  #contentwrap { flex: 1; min-width: 0; position: relative; display: flex; }
  #content { flex: 1; overflow: auto; padding: 24px; }
  #contenttools { position: absolute; top: 12px; right: 18px; z-index: 20; display: flex; gap: 8px; align-items: center; }
  #contentleft { position: absolute; top: 12px; left: 18px; z-index: 20; display: flex; gap: 6px; }
  #contenttools > *, #contentleft > * { flex: none; }
  #contentleft .btn { padding: 5px 11px; font-size: 12px; }
  /* ---- tree view (horizontal mindmap) ---- */
  .tree { display: flex; align-items: center; min-height: 100%; padding: 20px; width: max-content; }
  .mm-branch { display: flex; align-items: center; }
  .mm-children { display: flex; flex-direction: column; justify-content: center; margin-left: 56px; gap: 20px; }
  .mm-child { position: relative; display: flex; align-items: center; }
  .tree { position: relative; }
  .tree svg.links { position: absolute; left: 0; top: 0; pointer-events: none; }
  .mv { border: none; background: none; cursor: pointer; color: #bbb; padding: 0 1px; font-size: 10px; }
  .mv:hover { color: #333; }
  .node-card {
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border: 1px solid #d5d5cf;
    border-radius: 9px; background: #fff; cursor: pointer; font-size: 14px; white-space: nowrap;
    box-shadow: 0 1px 2px rgba(0,0,0,.04); position: relative;
  }
  /* 카드 사이 빈 칸(TREE_GAP 20px)도 이 카드의 드롭 구간으로 잡는다.
     의사 요소는 원래 요소로 히트 판정되므로 dragover 가 그대로 들어온다 */
  .node-card::before, .node-card::after {
    content: ''; position: absolute; left: 0; right: 0; height: 11px;   /* 1px 겹쳐 경계에 빈틈이 없게 */
  }
  .node-card::before { top: -11px; }
  .node-card::after  { bottom: -11px; }
  .node-card:hover { border-color: #999; }
  .node-card.selected { outline: 2px solid #6b7fd7; }
  .dragover { outline: 2px dashed #6b7fd7 !important; outline-offset: 2px; }
  .node-card .num { color: #b0b0aa; font-size: 11px; }
  .node-card .toggle { border: none; background: none; cursor: pointer; color: #999; padding: 0; font-size: 11px; }
  .node-card .addchild { border: none; background: none; cursor: pointer; color: #bbb; padding: 0; font-size: 15px; }
  .node-card .addchild:hover { color: #333; }
  .mm-root { background: #fff; font-weight: 600; cursor: default; }
  .c0 { background: #e5efe2; } .c1 { background: #e2edee; } .c2 { background: #e4e8f5; }
  .c3 { background: #eef0dc; } .c4 { background: #e9e4f2; } .c5 { background: #f0ecd8; } .c6 { background: #f4e2e0; }
  .cchild { background: #fbfbf9; }
  .badge { font-size: 11px; padding: 1px 8px; border-radius: 10px; background: #eee; color: #666; white-space: nowrap; }
  .imp1 { background: #f7e0e0; color: #a95a5a; }  /* 필수 Must */
  .imp2 { background: #f1e6d9; color: #9c7647; }  /* 권장 Should */
  .imp3 { background: #f2eecf; color: #8d873f; }  /* 선택 Could */
  .imp4 { background: #ebebe9; color: #8a8a84; }  /* 보류 Won't */
  #impfilter, #moremenu { position: relative; }
  .fitem.act { cursor: pointer; }
  .fitem.act small { color: #aaa; font-size: 11px; }
  .fmenu { position: absolute; top: 100%; right: 0; margin-top: 6px; background: #fff; border: 1px solid #e0e0db;
    border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.10); padding: 6px; z-index: 30; min-width: 190px; }
  .fitem { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .fitem:hover { background: #f5f5f2; }
  /* 내 계정 팝오버 */
  #authbox { position: relative; }
  .avatar-btn { padding: 0 !important; width: 30px; height: 30px;
    border-radius: 50% !important; overflow: hidden; }
  .avatar-pick, .cmt-av { border-radius: 50%; overflow: hidden; flex: none; color: #c4c4be;
    display: flex; align-items: center; justify-content: center; border: 1px solid #e8e8e4; }
  .avatar-pick { cursor: pointer; border-color: #e0e0db; }
  .avatar-pick:hover { filter: brightness(0.94); }
  .cmt-av { width: 26px; height: 26px; margin-top: 1px; }
  .gauge { height: 6px; border-radius: 3px; background: #eee; overflow: hidden; margin-top: 3px; }
  .gauge > i { display: block; height: 100%; background: #6b7fd7; }
  .gauge.warn > i { background: #c0392b; }
  .impsel { -webkit-appearance: none; appearance: none; border: none; cursor: pointer; font-family: inherit;
    font-size: 11px; padding: 2px 8px; border-radius: 10px; text-align: center; }
  .impsel:hover { filter: brightness(0.96); }
  .grip { color: #cdcdc7; cursor: grab; font-size: 12px; letter-spacing: -1px; }
  /* 드래그 중 놓일 위치 미리보기 */
  .drop-before { box-shadow: 0 -3px 0 0 #6b7fd7 !important; }
  .drop-after { box-shadow: 0 3px 0 0 #6b7fd7 !important; }
  /* 트리뷰는 사이 공간이 넓으니 그 자리에 막대를 띄운다 */
  .node-card.drop-before, .node-card.drop-after { box-shadow: 0 1px 2px rgba(0,0,0,.04) !important; }
  .node-card.drop-before::before, .node-card.drop-after::after {
    background: #6b7fd7; border-radius: 3px; height: 6px; margin: 2px 0;
  }
  /* 로그인 폼이 헤더에 있어 알림도 화면 위쪽에 띄운다. 모달(z 200)보다 위 */
  #toast { position: fixed; left: 50%; top: 72px; transform: translateX(-50%); z-index: 300;
    display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.28); z-index: 200;
    display: flex; align-items: center; justify-content: center; }
  #modal[hidden] { display: none; }
  .modal-box { background: #fff; border-radius: 12px; width: min(880px, 94vw);
    max-width: 92vw; max-height: 80vh; overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,.2); }
  .modal-body { padding: 24px 26px; max-height: 80vh; overflow: auto; }
  .vrow { display: flex; align-items: center; gap: 8px; padding: 11px 0; border-bottom: 1px solid #f0f0ec; }
  /* ---- 관리자 페이지 ---- */
  .adm { max-width: 940px; margin: 20px auto; }
  .adm h2 { font-size: 20px; margin-bottom: 4px; }
  .adm section { background: #fff; border: 1px solid #e5e5e0; border-radius: 10px;
    padding: 16px 18px; margin-top: 14px; }
  .adm h3 { font-size: 15px; margin-bottom: 10px; }
  .adm table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .adm th, .adm td { border-bottom: 1px solid #f0f0ec; padding: 8px 6px; text-align: left; }
  .adm th { color: #888; font-weight: 600; font-size: 12px; }
  .adm td .btn { padding: 4px 9px; font-size: 12px; }
  .rolesel { border: 1px solid #e2e2dd; background: #f7f7f5; border-radius: 6px;
    padding: 3px 8px; font-size: 12px; font-family: inherit; }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #eee; color: #666; }
  .pill.on { background: #e2eddd; color: #4a7a4a; }
  .pill.off { background: #f7e0e0; color: #a95a5a; }
  #toast div { background: #333; color: #fff; padding: 9px 16px; border-radius: 8px; font-size: 13px;
    box-shadow: 0 4px 14px rgba(0,0,0,.18); white-space: pre-line; }
  .node-card:hover .grip, .dir-item:hover .grip { color: #8f8f89; }
  /* ---- directory view ---- */
  .dir { display: flex; gap: 0; height: 100%; }
  .dir-list { width: 360px; border-right: 1px solid #e5e5e0; overflow: auto;
    padding: 46px 16px 0 0; }
  .dir-item .toggle { border: none; background: none; cursor: pointer; color: #999; padding: 0; font-size: 10px; }
  .dir-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  .dir-item:hover { background: #ececea; }
  .dir-item.selected { background: #e3e7f7; }
  .dir-item .num { min-width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
    background: #eef; color: #667; border-radius: 5px; font-size: 12px; }
  .dir-item.child { margin-left: 28px; }
  .dir-item.child .num { background: #f2f2ef; }
  .dir-top { border-top: 1px solid #eee; margin-top: 6px; padding-top: 7px; }
  .dir-detail { flex: 1; overflow: auto; padding: 46px 32px 8px; }
  /* ---- detail panel ---- */
  #panel { width: 460px; background: #fff; border-left: 1px solid #e5e5e0; padding: 24px 28px; overflow: auto; display: none; }
  #panel.open { display: block; }
  /* ---- 이미지 앨범 ---- */
  #album { width: 372px; background: #fff; border-left: 1px solid #e5e5e0;
    padding: 18px 20px; overflow: auto; }
  #album[hidden] { display: none; }
  .alb-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .alb-date { font-size: 12px; color: #999; margin: 16px 0 7px; }
  .alb-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .alb-item { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden;
    border: 2px solid transparent; background: #f4f4f2; cursor: pointer; }
  .alb-item.used { border-color: #4a7de0; }
  .alb-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .alb-item.sel::after { content: '✓'; position: absolute; inset: 0; background: rgba(70,70,70,.55);
    color: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center; }
  .alb-trash { position: relative; overflow: visible; }
  .alb-trash .cnt { position: absolute; top: -7px; left: -7px; min-width: 19px; height: 19px;
    padding: 0 5px; background: #d64534; color: #fff; border-radius: 10px; font-size: 11px;
    font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .sq { display: inline-block; width: 11px; height: 11px; border: 2px solid #4a7de0;
    border-radius: 3px; vertical-align: -1px; margin-right: 3px; }
  /* readable detail view; every field edits in place on click */
  .dir-detail .detail { max-width: 820px; }
  .detail h1 { font-size: 22px; margin: 4px -7px 12px; padding: 3px 7px; border-radius: 7px; cursor: text; }
  .detail h1:hover, .desc-md:hover { background: #f2f2ef; }
  .detail .sep { border: none; border-top: 1px solid #eee; margin: 16px 0; }
  .desc-md { cursor: text; padding: 10px; margin: -10px; border-radius: 8px; min-height: 70px; line-height: 1.75; }
  .desc-md .ph { color: #bbb; }
  /* ---- 용어 사전 ---- */
  .term { border-bottom: 1px dashed #8a9bd0; color: #46538a; cursor: help; padding: 0 1px; }
  .term:hover { background: #eef1fb; }
  #termtip { position: fixed; z-index: 300; max-width: 320px; background: #fff; color: #333;
    border: 1px solid #d9d9d3; border-radius: 8px; padding: 10px 13px; font-size: 13px;
    line-height: 1.6; box-shadow: 0 8px 24px rgba(0,0,0,.14); }
  #termtip[hidden] { display: none; }
  #termtip b.t { display: block; font-size: 12px; color: #46538a; margin-bottom: 4px; }
  .gtable { width: 100%; border-collapse: collapse; font-size: 13px; }
  .gtable th { text-align: left; font-size: 12px; color: #888; font-weight: 600;
    border-bottom: 1px solid #eee; padding: 6px 8px; }
  .gtable td { border-bottom: 1px solid #f2f2ee; padding: 9px 8px; vertical-align: top; }
  .gterm { font-family: Consolas, monospace; color: #46538a; background: #eef1fb;
    padding: 3px 8px; border-radius: 5px; white-space: nowrap; cursor: grab; display: inline-block; }
  .gterm:active { cursor: grabbing; }
  .mcp-cmd { display: flex; gap: 8px; align-items: flex-start; background: #f7f7f5;
    border: 1px solid #e5e5e0; border-radius: 8px; padding: 10px 12px; margin: 4px 0 14px; }
  .mcp-cmd code, .mcp-cmd pre { flex: 1; font-family: Consolas, monospace; font-size: 12px;
    line-height: 1.6; word-break: break-all; }
  .gdesc { cursor: text; border-radius: 6px; }
  .gdesc:hover { background: #f6f6f3; }
  .guse { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .btn.goto { padding: 2px 9px; font-size: 11px; border-radius: 12px; color: #46538a;
    border-color: #d6ddf2; background: #f5f7fd; }
  .btn.goto:hover { background: #e8edfb; }
  .desc-md a, .prd-doc a, #termtip a, .gdesc a { color: #2f62c4; text-decoration: underline; }
  .md-tw { overflow-x: auto; margin: 10px 0; }
  .md-tw table { border-collapse: collapse; font-size: 13px; }
  .md-tw th, .md-tw td { border: 1px solid #e2e2dd; padding: 6px 11px; line-height: 1.6; }
  .md-tw th { background: #f6f6f3; font-weight: 600; white-space: nowrap; }
  .mv[disabled] { opacity: .3; cursor: default; }
  .pill-select { border: 1px solid #e2e2dd; background: #f7f7f5; border-radius: 20px;
    padding: 3px 10px; font-size: 12px; color: #555; font-family: inherit; cursor: pointer; }
  .inline-edit { width: 100%; font: inherit; padding: 7px 9px; border: 1px solid #6b7fd7;
    border-radius: 7px; outline: none; background: #fff; }
  .inline-edit.title-edit { font-size: 22px; font-weight: 700; }
  textarea.inline-edit { min-height: 240px; line-height: 1.75; resize: vertical; }
  .hint { font-size: 12px; color: #aaa; margin-top: 6px; }
  .btnrow { display: flex; gap: 8px; margin-top: 18px; }
  .btn { padding: 8px 16px; border-radius: 6px; border: 1px solid #ddd; background: #fff; cursor: pointer; font-size: 14px; }
  .btn.primary { background: #333; color: #fff; border-color: #333; }
  .btn.danger { color: #c0392b; border-color: #e5b4ae; }
  .meta { font-size: 13px; color: #888; display: flex; gap: 16px; align-items: center; }
  /* ---- PRD ---- */
  .prd-doc { max-width: 820px; margin: 0 auto; background: #fff; border: 1px solid #e5e5e0; border-radius: 10px; padding: 40px 48px; line-height: 1.7; }
  .prd-doc h1 { font-size: 26px; margin: 0 0 20px; } .prd-doc h2 { font-size: 20px; margin: 28px 0 10px; }
  .prd-doc h3 { font-size: 16px; margin: 20px 0 6px; } .prd-doc p { margin: 8px 0; }
  .prd-doc h4 { font-size: 14px; margin: 16px 0 4px; } .prd-doc h5 { font-size: 13px; margin: 14px 0 4px; }
  .prd-doc h6 { font-size: 13px; margin: 14px 0 4px; color: #777; }
  .prd-doc ul { padding-left: 22px; margin: 8px 0; }
  .prd-doc { cursor: text; }
  .prd-doc:hover { border-color: #d8d8d2; }
  #prd-edit { width: 100%; max-width: 820px; display: block; margin: 0 auto 12px; min-height: 65vh; padding: 20px;
    border: 1px solid #ddd; border-radius: 10px; font-size: 14px; font-family: Consolas, monospace; line-height: 1.6; }
  .toolbar { max-width: 820px; margin: 0 auto 14px; display: flex; justify-content: flex-end; gap: 8px; }
  /* 본문 제목: 크기를 모두 지정한다. 지정하지 않으면 h1 이 .detail h1(항목 제목용, 22px)을
     물려받고 h2·h3 는 브라우저 기본값이라 # 보다 ## 가 커지는 역전이 생긴다 */
  .desc-md h1, .desc-md h2, .desc-md h3,
  .desc-md h4, .desc-md h5, .desc-md h6,
  .gdesc h1, .gdesc h2, .gdesc h3, .gdesc h4, .gdesc h5, .gdesc h6,
  #termtip h1, #termtip h2, #termtip h3, #termtip h4, #termtip h5, #termtip h6 { margin: 14px 0 6px; }
  .desc-md h1, .gdesc h1, #termtip h1 { font-size: 20px; }
  .desc-md h2, .gdesc h2, #termtip h2 { font-size: 17px; }
  .desc-md h3, .gdesc h3, #termtip h3 { font-size: 15px; }
  .desc-md h4, .gdesc h4, #termtip h4 { font-size: 14px; }
  .desc-md h5, .desc-md h6, .gdesc h5, .gdesc h6, #termtip h5, #termtip h6 { font-size: 13px; }
  .desc-md h6, .gdesc h6, #termtip h6 { color: #777; }
  .desc-md ul { padding-left: 20px; } .desc-md p { margin: 6px 0; }
</style>
</head>
<body>
<header>
  <div class="hgroup">
    <button class="btn ibtn logo-btn" id="btn-projects" title="내 프로젝트" aria-label="내 프로젝트"><img src="/logo.svg" alt="얼개 플래너" height="28"></button>
    <b id="proj-name"></b>
    <button class="btn ibtn" id="btn-glossary" onclick="openGlossary()" title="용어 사전" aria-label="용어 사전"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10.5 5.2 8.5 4.5 6 4.5H3v14h3c2.5 0 4.5.7 6 2 1.5-1.3 3.5-2 6-2h3v-14h-3c-2.5 0-4.5.7-6 2z"/><path d="M12 6.5v12"/></svg></button>
    <button class="btn ibtn" id="btn-save" onclick="saveVersion()" title="현재 상태 저장 (PRD + 기능명세서)" aria-label="현재 상태 저장"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h11l5 5v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M8 4v5h6V4"/><path d="M8 21v-6h8v6"/></svg></button>
    <span id="joinbox" style="display:flex;gap:8px;align-items:center"></span>
  </div>
  <div class="tabs" id="tabs">
    <button id="tab-prd" class="active" onclick="setTab('prd')">PRD</button>
    <button id="tab-spec" onclick="setTab('spec')">기능명세서</button>
  </div>
  <div class="hgroup right">
    <div id="authbox" style="display:flex;gap:6px;align-items:center"></div>
    <div id="moremenu"></div>
  </div>
</header>
<div id="toast"></div>
<div id="modal" hidden></div>
<div id="termtip" hidden></div>
<main>
  <div id="contentwrap">
    <div id="contentleft">
      <button class="btn" onclick="collapseAll()" title="모든 하위 항목 접기">전체 접기</button>
      <button class="btn" onclick="expandAll()" title="모든 하위 항목 펼치기">전체 펼치기</button>
    </div>
    <div id="contenttools">
      <div class="viewtoggle" id="viewtoggle">

// 파일을 128px 정사각형으로 줄여 data URL 로 만든다 (원본 그대로면 DB 가 커진다)
function shrinkAvatar(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader(), img = new Image();
    fr.onerror = rej; img.onerror = rej;
    fr.onload = () => { img.src = fr.result; };
    img.onload = () => {
      const S = 128, c = document.createElement('canvas');
      c.width = c.height = S;
      const m = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S, S);
      res(c.toDataURL('image/jpeg', 0.85));
    };
    fr.readAsDataURL(file);
  });
}

// nodes 를 받을 때 한 번만 인덱스를 만들어 두고 재사용한다 (예전엔 호출마다 전체 배열을 훑었다)
let kidsMap = null, nodeMap = null;
const NO_KIDS = [];
function setNodes(list) { nodes = list; kidsMap = nodeMap = null; }
function buildIndex() {
  kidsMap = new Map(); nodeMap = new Map();
  for (const n of nodes) {
    nodeMap.set(n.id, n);
    const arr = kidsMap.get(n.parent_id);
    if (arr) arr.push(n); else kidsMap.set(n.parent_id, [n]);
  }
  for (const arr of kidsMap.values()) arr.sort((a, b) => a.sort_order - b.sort_order || a.id - b.id);
}
function childrenOf(pid) {
  if (!kidsMap) buildIndex();
  return kidsMap.get(pid) || NO_KIDS;
}
function nodeById(id) {
  if (!nodeMap) buildIndex();
  return nodeMap.get(id);
}
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

// minimal markdown: #/##/### headings, - bullets, blank-line paragraphs
// ![alt](url) → <img>. 우리 이미지 API와 http(s) 주소만 허용한다
const SAFE_HREF = /^(https?:\/\/|mailto:|#|\/)/;
// 스킴 없는 주소(localhost:3000/... , example.com/...)도 링크로 인정한다
const HOSTLIKE = /^(localhost(:\d+)?|[\w-]+(\.[\w-]+)+(:\d+)?)([\/?#]|$)/;
function safeHref(url) {
  if (SAFE_HREF.test(url)) return url;
  if (HOSTLIKE.test(url)) return '//' + url;   // 현재 페이지와 같은 http/https 로 연결
  return null;
}
function inline(raw) {
  let t = esc(raw);
  const keep = [];
  const stash = html => `\u0000${keep.push(html) - 1}\u0000`;
  // ![대체텍스트](주소) → 이미지
  t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m, alt, url) =>
    /^(\/api\/images\/[\w-]+|https?:\/\/)/.test(url)
      ? stash(`<img src="${url}" alt="${alt}" loading="lazy">`) : m);
  // [표시이름](주소) → 링크
  t = t.replace(/(^|[^!])\[([^\]]+)\]\(([^)\s]+)\)/g, (m, pre, label, url) => {
    const href = safeHref(url);
    return href ? pre + stash(`<a href="${href}" target="_blank" rel="noopener">${label}</a>`) : m;
  });
  // 주소만 적어도 링크 ([url](url) 와 같은 결과)
  t = t.replace(/(^|[\s(])((?:https?:\/\/|localhost:\d+)[^\s<>"')\]]*)/g, (m, pre, url) =>
    pre + stash(`<a href="${safeHref(url)}" target="_blank" rel="noopener">${url}</a>`));
  // `용어` → 용어 사전 링크
  t = t.replace(/`([^`\n]{1,60})`/g, (m, w) =>
    stash(`<span class="term" data-term="${w.trim()}" onclick="openGlossary()">${w}</span>`));
  // **굵게** / *기울임* / _기울임_
  t = t.replace(/\*\*([^*\n]+)\*\*/g, (m, w) => stash(`<strong>${w}</strong>`));
  t = t.replace(/\*([^*\n]+)\*/g, (m, w) => stash(`<em>${w}</em>`));
  t = t.replace(/(^|[\s(])_([^_\n]+)_(?=$|[\s.,;:)!?])/g, (m, pre, w) => pre + stash(`<em>${w}</em>`));
  return t.replace(/\u0000(\d+)\u0000/g, (m, i) => keep[i]);
}

function md(text) {
  const lines = text.split('\n');
  const out = [];
  let ul = false;
  const closeUl = () => { if (ul) { out.push('</ul>'); ul = false; } };
  const isRow = s => /^\s*\|.*\|\s*$/.test(s);
  const cellsOf = s => s.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
  const isSep = s => isRow(s) && cellsOf(s).every(c => /^:?-{2,}:?$/.test(c));
  const skipBlank = i => { while (i < lines.length && !lines[i].trim()) i++; return i; };

  for (let i = 0; i < lines.length; i++) {
    const t = lines[i].trim();
    if (!t) continue;

    // | 머리 | 글 |  +  |---|---|  → 표 (줄 사이 빈 줄도 허용)
    if (isRow(t)) {
      const sepAt = skipBlank(i + 1);
      if (sepAt < lines.length && isSep(lines[sepAt])) {
        closeUl();
        const align = cellsOf(lines[sepAt]).map(c =>
          c.startsWith(':') && c.endsWith(':') ? 'center' : c.endsWith(':') ? 'right' : 'left');
        const cell = (c, x, tag) =>
          `<${tag} style="text-align:${align[x] || 'left'}">${inline(c)}</${tag}>`;
        const head = cellsOf(t).map((c, x) => cell(c, x, 'th')).join('');
        const body = [];
        let k = sepAt + 1;
        while (k < lines.length) {
          const nb = skipBlank(k);
          if (nb >= lines.length || !isRow(lines[nb])) break;
          body.push('<tr>' + cellsOf(lines[nb]).map((c, x) => cell(c, x, 'td')).join('') + '</tr>');
          k = nb + 1;
        }
        out.push(`<div class="md-tw"><table><thead><tr>${head}</tr></thead><tbody>${body.join('')}</tbody></table></div>`);
        i = k - 1;
        continue;
      }
    }

    if (t.startsWith('- ')) {
      if (!ul) { out.push('<ul>'); ul = true; }
      out.push('<li>' + inline(t.slice(2)) + '</li>');
      continue;
    }
    closeUl();
    const h = t.match(/^(#{1,6})\s+(.*)/);
    if (h) out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`);
    else out.push('<p>' + inline(t) + '</p>');
  }
  closeUl();
  return out.join('');
}

let pickingImage = false;
async function uploadImage(file) {
  if (!file || !file.type.startsWith('image/')) return null;
  if (file.size > 5 * 1024 * 1024) { toast('이미지는 5MB 이하만 올릴 수 있습니다'); return null; }
  toast('이미지 올리는 중…');
  let url = `/api/projects/${project.slug}/images`;
  if (shareToken) url += '?share=' + encodeURIComponent(shareToken);
  const r = await fetch(url, { method: 'POST', headers: { ...authHeaders(), 'Content-Type': file.type }, body: file });
  if (!r.ok) { toast((await r.json().catch(() => ({}))).detail || '이미지 업로드 실패'); return null; }
  return (await r.json()).url;
}
async function insertImage(box, file) {
  const url = await uploadImage(file);
  if (!url) return;
  const at = box.selectionStart, end = box.selectionEnd;
  const snippet = (at && box.value[at - 1] !== '\n' ? '\n' : '') + `![](${url})\n`;
  box.value = box.value.slice(0, at) + snippet + box.value.slice(end);
  box.selectionStart = box.selectionEnd = at + snippet.length;
  box.focus();
}
// 붙여넣기 / 끌어놓기 / 버튼으로 이미지 삽입
function enableImages(box, toolbar) {
  if (!box) return;
  box.addEventListener('paste', e => {
    const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
    if (!item) return;
    e.preventDefault();
    insertImage(box, item.getAsFile());
  });
  box.addEventListener('dragover', e => {
    if ([...(e.dataTransfer?.types || [])].includes('Files')) { e.preventDefault(); e.stopPropagation(); }
  });
  box.addEventListener('drop', e => {
    const f = [...(e.dataTransfer?.files || [])].find(x => x.type.startsWith('image/'));
    if (!f) return;
    e.preventDefault(); e.stopPropagation();
    insertImage(box, f);
  });
  if (!toolbar) return;
  const btn = document.createElement('button');
  btn.className = 'btn';
  btn.style.cssText = 'padding:4px 12px;font-size:12px';
  btn.textContent = '이미지 추가';
  btn.onmousedown = e => e.preventDefault();          // 편집기 포커스 유지
  btn.onclick = () => {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = 'image/*';
    pickingImage = true;
    input.onchange = async () => { await insertImage(box, input.files[0]); pickingImage = false; };
    window.addEventListener('focus', () => setTimeout(() => { pickingImage = false; }, 300), { once: true });
    input.click();
  };
  toolbar.prepend(btn);
}

function exportMarkdown() {
  const abs = t => t.replace(/\]\(\/api\/images\//g, '](' + location.origin + '/api/images/');
  const out = [`# ${project.name}`, '', '## PRD', '', abs(prdContent.trim()), '', '---', '', '## 기능명세서', ''];
  const walk = (pid, prefix, depth) => childrenOf(pid).forEach((n, i) => {
    const num = prefix ? `${prefix}.${i + 1}` : String(i + 1);
    out.push(`${'#'.repeat(Math.min(depth + 3, 6))} ${num} ${n.title}`, '');
    out.push(`- 상태: ${n.status}`, `- 중요도: ${moscow(n.importance).ko} (${moscow(n.importance).en})`, '');
    if (n.description.trim()) out.push(abs(n.description.trim()), '');
    walk(n.id, num, depth + 1);
  });
  walk(null, '', 0);
  const blob = new Blob([out.join('\n')], { type: 'text/markdown;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${project.name}.md`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  moreOpen = false; render();

}

let dragTerm = null;
function termDragStart(e, id) {
  dragTerm = id;
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', String(id)); } catch (_) {}
  e.stopPropagation();
}
function termDragOver(e, targetId) {
  if (dragTerm == null || dragTerm === targetId) return;
  e.preventDefault(); e.stopPropagation();
  if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
  const el = e.currentTarget;
  clearDropHints(el);
  const r = el.getBoundingClientRect();
  el.classList.add(e.clientY > r.top + r.height / 2 ? 'drop-after' : 'drop-before');
}
async function termDrop(e, targetId) {
  e.preventDefault(); e.stopPropagation();
  const r = e.currentTarget.getBoundingClientRect();
  const after = e.clientY > r.top + r.height / 2;
  clearDropHints();
  const id = dragTerm; dragTerm = null;
  if (id == null || id === targetId) return;
  const g = termGroups().find(x => x.items.some(t => t.id === targetId));
  if (!g || !g.items.some(t => t.id === id))
    return toast('같은 카테고리 안에서만 순서를 바꿀 수 있습니다.');
  const moved = g.items.find(t => t.id === id);
  const order = g.items.filter(t => t.id !== id);
  order.splice(order.findIndex(t => t.id === targetId) + (after ? 1 : 0), 0, moved);
  // 이 묶음이 쓰던 sort_order 값들을 새 순서대로 다시 배정한다
  const slots = g.items.map(t => t.sort_order).sort((a, b) => a - b);
  await Promise.all(order.map((t, i) => t.sort_order === slots[i] ? null :
    api('/api/terms/' + t.id, { method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sort_order: slots[i] }) })));
  await loadTerms(); paintModal();
}

function gotoNode(id) {

  if (n) {

// 가상 스크롤에서는 대상이 아직 DOM 에 없을 수 있어, 위치를 계산해 먼저 그 구간으로 스크롤한다
function treeYOf(id) {
  if (!leafMemo) leafMemo = new Map();
  const path = [];
  for (let cur = nodeById(id); cur; cur = nodeById(cur.parent_id)) path.unshift(cur);
  let y = 0, sibs = shownChildren(null, '');
  for (const node of path) {
    for (const [sib] of sibs) {
      if (sib.id === node.id) break;
      y += spanH(sib) + TREE_GAP;
    }
    sibs = shownChildren(node.id, '');
  }
  return y + spanH(nodeById(id)) / 2;
}
function scrollToNode(id) {
  if (view === 'tree') {
    const c = document.getElementById('content');
    if (!c || !nodeById(id)) return;
    c.scrollTop = Math.max(0, treeYOf(id) - c.clientHeight / 2);
    renderTree(c);
  } else {
    const list = document.querySelector('.dir-list');
    if (!list) return;
    const i = dirRows.findIndex(r => r.n.id === id);
    if (i < 0) return;
    list.scrollTop = Math.max(0, dirTops[i] - list.clientHeight / 2);
    paintDirList();
  }
}

async function moveTerm(id, dir) {
  const g = termGroups().find(x => x.items.some(t => t.id === id));
  const i = g.items.findIndex(t => t.id === id), j = i + dir;
  if (j < 0 || j >= g.items.length) return;
  const a = g.items[i], b = g.items[j];
  await Promise.all([
    api('/api/terms/' + a.id, { method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sort_order: b.sort_order }) }),
    api('/api/terms/' + b.id, { method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sort_order: a.sort_order }) }),
  ]);
  await loadTerms(); paintModal();
}

    paintModal();
  };
  box.addEventListener('blur', () => finish(true));
  box.addEventListener('keydown', e => {
    if (e.key === 'Escape') finish(false);
    else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); finish(true); }
  });
}

// 본문의 용어에 마우스를 올리면 설명을 띄운다
const tipEl = () => document.getElementById('termtip');
document.addEventListener('mouseover', e => {
  const el = e.target.closest && e.target.closest('.term');
  if (!el) return;
  const t = termOf(el.dataset.term);
  const tip = tipEl();
  tip.innerHTML = `<b class="t">${esc(el.dataset.term)}</b>` +
    (t && t.description.trim() ? md(t.description)
      : '<span style="color:#aaa">설명이 없습니다. 용어 사전에서 작성하세요.</span>');
  clearTimeout(tipTimer);
  tip.hidden = false;
  const r = el.getBoundingClientRect(), b = tip.getBoundingClientRect();
  tip.style.top = (r.bottom + 8 + b.height > innerHeight ? r.top - b.height - 8 : r.bottom + 8) + 'px';
  tip.style.left = Math.max(8, Math.min(r.left, innerWidth - b.width - 12)) + 'px';
});
// 본문·용어 설명의 링크는 항상 새 탭에서 (내장 브라우저에서도 현재 창을 벗어나지 않게)
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('.desc-md a, .prd-doc a, .gdesc a, #termtip a');
  if (!a || !a.href) return;
  e.preventDefault();
  const w = window.open(a.href, '_blank', 'noopener');
  if (!w) toast('새 탭이 차단되었습니다: ' + a.href);
});

let tipTimer = null;
const keepTip = () => { clearTimeout(tipTimer); };
const dropTip = () => { tipTimer = setTimeout(() => { tipEl().hidden = true; }, 250); };
document.addEventListener('mouseout', e => {
  if (e.target.closest && e.target.closest('.term')) dropTip();
});
// 말풍선 위로 마우스가 넘어오면 유지 (안의 링크를 누를 수 있게)
document.getElementById('termtip').addEventListener('mouseenter', keepTip);
document.getElementById('termtip').addEventListener('mouseleave', () => { tipEl().hidden = true; });

// 0-based depth: 대분류 = 0
function depthOf(n) { let d = 0; while (n && n.parent_id != null) { n = nodeById(n.parent_id); d++; } return d; }
const canAddChild = n => depthOf(n) < MAX_DEPTH - 1;

// ---------- drag & drop (reparent) ----------
let dragId = null;
const DND = id => `draggable="true" ondragstart="dragStart(event,${id})" ondragend="dragEnd()"`;
const GRIP = '<span class="grip" title="드래그하여 다른 항목 위로 옮기기">⠿</span>';
const DROP = pid => `ondragover="dragOver(event,${pid})" ondragleave="dragLeave(event)" ondrop="dropOn(event,${pid})"`;
function dragStart(e, id) {
  if (!canEdit()) { e.preventDefault(); return; }   // 읽기 전용이면 드래그 자체를 막는다
  dragId = id;
  e.dataTransfer.effectAllowed = 'move';
  // setData 가 없으면 Firefox 등에서는 드래그 자체가 시작되지 않는다
  try { e.dataTransfer.setData('text/plain', String(id)); } catch (_) {}
  e.stopPropagation();
}
function dragEnd() { dragId = null; clearDropHints(); }
const clearDropHints = el =>
  (el ? [el] : [...document.querySelectorAll('.dragover,.drop-before,.drop-after')])
    .forEach(x => x.classList.remove('dragover', 'drop-before', 'drop-after'));

// 위쪽 30% = 앞에, 아래쪽 30% = 뒤에, 가운데 = 하위로
function dropZone(e, targetId) {
  const el = e.currentTarget;
  if (targetId == null || el.classList.contains('mm-root') || el.classList.contains('dir-list')) return 'into';
  const r = el.getBoundingClientRect();
  const p = (e.clientY - r.top) / r.height;
  return p < 0.3 ? 'before' : p > 0.7 ? 'after' : 'into';
}
function dragOver(e, targetId) {
  e.preventDefault(); e.stopPropagation();
  if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
  const el = e.currentTarget;
  clearDropHints(el);
  const z = dropZone(e, targetId);
  el.classList.add(z === 'into' ? 'dragover' : z === 'before' ? 'drop-before' : 'drop-after');
}
function dragLeave(e) { clearDropHints(e.currentTarget); }
const put = (id, body) => api('/api/nodes/' + id, { method: 'PUT',
  headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
const subtreeHeight = n => 1 + Math.max(0, ...childrenOf(n.id).map(subtreeHeight));
const isAncestor = (ancId, n) => {
  for (let cur = n; cur; cur = nodeById(cur.parent_id)) if (cur.id === ancId) return true;
  return false;
};

// 가운데에 놓으면 하위로, 위/아래에 놓으면 그 형제 자리로 끼워 넣는다
async function dropOn(e, targetId) {
  e.preventDefault(); e.stopPropagation();
  const zone = dropZone(e, targetId);
  clearDropHints();
  const id = dragId; dragId = null;
  if (id == null || id === targetId) return;
  const node = nodeById(id);
  const target = nodeById(targetId);
  const newParent = zone === 'into' ? targetId : (target ? target.parent_id : null);

  if (newParent != null && isAncestor(id, nodeById(newParent)))
    return toast('자기 하위 항목으로는 이동할 수 없습니다.');
  const parentDepth = newParent == null ? -1 : depthOf(nodeById(newParent));
  if (parentDepth + 1 + subtreeHeight(node) > MAX_DEPTH)
    return toast(`${MAX_DEPTH}단계까지만 만들 수 있습니다.`);

  if (zone === 'into') {
    if (node.parent_id === targetId) return;
    await put(id, { parent_id: targetId });
  } else {
    if (node.parent_id !== newParent) await put(id, { parent_id: newParent });
    setNodes(await reloadNodes());
    const sibs = childrenOf(newParent).filter(x => x.id !== id);
    const at = sibs.findIndex(x => x.id === targetId) + (zone === 'after' ? 1 : 0);
    sibs.splice(at, 0, nodeById(id));
    await Promise.all(sibs.map((x, i) => x.sort_order === i ? null : put(x.id, { sort_order: i })));
  }
  setNodes(await reloadNodes()); render();
}

async function moveNode(id, dir) {
  if (!needEdit()) return;
  const node = nodeById(id);
  const sibs = childrenOf(node.parent_id);
  const i = sibs.findIndex(s => s.id === id), j = i + dir;
  if (j < 0 || j >= sibs.length) return;
  const order = sibs.map(s => s.id);
  [order[i], order[j]] = [order[j], order[i]];
  await Promise.all(order.map((nid, k) =>
    api('/api/nodes/' + nid, { method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sort_order: k }) })));
  setNodes(await reloadNodes()); render();
}

        <button class="btn" style="padding:3px 9px;font-size:12px" onclick="setAllImp(true)">전체 선택</button>
        <button class="btn" style="padding:3px 9px;font-size:12px" onclick="setAllImp(false)">전체 해제</button>
      </div></div>` : ''}`;
  if (admin.open) {
    document.getElementById('panel').classList.remove('open');
    document.getElementById('album').hidden = true;
    document.getElementById('tabs').style.display = 'none';
    document.getElementById('contenttools').style.display = 'none';
    document.getElementById('proj-name').textContent = '';
    renderAdmin(c);
    if (modalRender) paintModal();
    return;
  }
  if (!has) {
    renderProjects(c);
    document.getElementById('panel').classList.remove('open');
    document.getElementById('album').hidden = true;
    restoreScroll();
    return;
  }
  document.getElementById('tab-spec').classList.toggle('active', tab === 'spec');
  document.getElementById('tab-prd').classList.toggle('active', tab === 'prd');
  document.getElementById('view-tree').classList.toggle('active', view === 'tree');
  document.getElementById('view-dir').classList.toggle('active', view === 'dir');
  renderAlbum();
  if (modalRender) paintModal();
  if (tab === 'prd') {
    renderPrd(c);
    document.getElementById('panel').classList.remove('open');
    restoreScroll();
    return;
  }
  if (view === 'tree') {
    c.onscroll = () => onTreeScroll(c);
    renderTree(c); renderPanel();
    // 빈 배경을 클릭하면 사이드 패널을 닫는다
    c.onclick = e => { if (selectedId != null && !e.target.closest('.node-card')) closePanel(); };
  }
  else { c.onscroll = null; renderDir(c); document.getElementById('panel').classList.remove('open'); }
  restoreScroll();
}

// 헤더의 프로젝트 이름을 그 자리에서 편집
let editingName = false;
function editProjectName() {
  if (editingName) return;
  const el = document.getElementById('proj-name');
  const box = document.createElement('input');
  box.className = 'inline-edit';
  box.style.cssText = 'width:200px;font-size:15px;font-weight:700';
  box.value = project.name;
  editingName = true;
  el.textContent = '';
  el.appendChild(box);          // 요소를 통째로 바꾸지 않는다 (render 가 참조함)
  box.focus(); box.select();
  let done = false;
  const finish = async save => {
    if (done) return;
    done = true;
    const name = box.value.trim();
    if (save && name && name !== project.name) {
      try {
        await api('/api/projects/' + project.slug, { method: 'PUT',
          headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
        project.name = name;
        await loadProjects();
        project = projects.find(x => x.id === project.slug) || project;
      } catch (e) { toast(e.detail || '이름 변경 실패'); }
    }
    editingName = false;
    render();
  };
  box.addEventListener('blur', () => finish(true));
  box.addEventListener('keydown', e => {
    if (e.key === 'Escape') finish(false);
    else if (e.key === 'Enter') { e.preventDefault(); finish(true); }
  });
}

// 프로젝트 목록에서 이름을 그 자리에서 편집
function renameProject(slug) {
  const el = document.querySelector(`[data-pname="${slug}"]`);
  const cur = projects.find(p => p.slug === slug);
  if (!el || !cur) return;
  const box = document.createElement('input');
  box.className = 'inline-edit';
  box.value = cur.name;
  el.replaceWith(box);
  box.focus(); box.select();
  let done = false;
  const finish = async save => {
    if (done) return;
    done = true;
    const name = box.value.trim();
    if (save && name && name !== cur.name) {
      await api('/api/projects/' + slug, { method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name }) });
      await loadProjects();
    }
    render();
  };
  box.addEventListener('blur', () => finish(true));
  box.addEventListener('keydown', e => {
    if (e.key === 'Escape') finish(false);
    else if (e.key === 'Enter') { e.preventDefault(); finish(true); }
  });
}

// ---------- 트리 가상 스크롤 ----------
const TREE_GAP = 20;          // .mm-children gap 과 같아야 한다
const TREE_BUFFER = 800;      // 화면 위·아래로 미리 그려두는 여유 픽셀
let CARD_H = 38, leafMemo = null;
// 이 가지가 차지하는 세로 줄 수(=말단 개수). 접힘·필터를 반영한다
function leafCount(n) {
  const hit = leafMemo.get(n.id);
  if (hit) return hit;
  const kids = collapsed.has(n.id) ? [] : shownChildren(n.id, '');
  let v = 0;
  if (!kids.length) v = 1;
  else for (const [k] of kids) v += leafCount(k);
  leafMemo.set(n.id, v);
  return v;
}
const spanH = n => { const L = leafCount(n); return L * CARD_H + (L - 1) * TREE_GAP; };
let treeScrollAt = 0, treeTick = false;
function onTreeScroll(c) {
  if (treeTick) return;
  if (Math.abs(c.scrollTop - treeScrollAt) < TREE_BUFFER / 2) return;
  treeTick = true;
  requestAnimationFrame(() => {
    treeTick = false;
    if (view === 'tree' && tab === 'spec' && project) { renderTree(c); }
  });
}

function renderTree(c) {
  leafMemo = new Map();
  const probe = c.querySelector('.node-card');       // 이전 렌더에서 실제 카드 높이를 재둔다
  if (probe) CARD_H = probe.getBoundingClientRect().height || CARD_H;   // 반올림하면 오차가 누적된다
  const winTop = c.scrollTop - TREE_BUFFER, winBot = c.scrollTop + c.clientHeight + TREE_BUFFER;
  treeScrollAt = c.scrollTop;
  // 화면 밖 가지는 같은 높이의 빈 칸으로만 남긴다 (스크롤 길이는 그대로)
  const kidsHTML = (kids, top, render) => {
    let y = top;
    return kids.map(entry => {
      const h = spanH(entry[0]), y0 = y;
      y += h + TREE_GAP;
      return (y0 + h < winTop || y0 > winBot)
        ? `<div class="mm-child" style="height:${h}px"></div>`
        : `<div class="mm-child">${render(entry, y0)}</div>`;
    }).join('');
  };
  const branch = (n, num, depth, rootIdx, top) => {
    const kids = shownChildren(n.id, num);
    const closed = collapsed.has(n.id);
    const color = depth === 0 ? 'c' + (rootIdx % 7) : 'cchild';
    return `<div class="mm-branch">
      <span class="node-card ${color} ${n.id === selectedId ? 'selected' : ''}" data-id="${n.id}" onclick="select(${n.id})" title="더블클릭하면 하위를 모두 펼치거나 접습니다" ${DND(n.id)} ${DROP(n.id)}>
        ${GRIP}<span>${esc(n.title)}</span><span class="num">${num}</span>
        ${impSelect(n)}
        ${depth < MAX_DEPTH - 1 && canEdit() ? `<button class="addchild" title="하위 추가" onclick="event.stopPropagation();addNode(${n.id})">＋</button>` : ''}
        ${MV(n.id)}
        ${kids.length ? `<button class="toggle" onclick="event.stopPropagation();toggleCollapse(${n.id})">${closed ? '▶' : '◀'}</button>` : ''}
      </span>
      ${kids.length && !closed
        ? `<div class="mm-children">${kidsHTML(kids, top, ([k, kn], y) => branch(k, kn, depth + 1, rootIdx, y))}</div>`
        : ''}
    </div>`;
  };
  const roots = shownChildren(null, '');
  const empty = filterOn() ? '선택한 중요도에 해당하는 항목이 없습니다.' : '항목이 없습니다. 대분류를 추가하세요.';
  c.innerHTML = `<div class="tree"><svg class="links"></svg><div class="mm-branch">
    <span class="node-card mm-root" data-id="root" ${DROP(null)} title="여기에 드롭하면 대분류가 됩니다">PRD</span>
    <div class="mm-children">${kidsHTML(roots, 0, ([n, num], y) => branch(n, num, 0, roots.findIndex(r => r[0].id === n.id), y))}
      ${roots.length ? '' : `<div class="mm-child"><span style="color:#aaa">${empty}</span></div>`}
      ${canEdit() ? `<div class="mm-child">
        <span class="node-card ghost" data-id="ghost" onclick="addNode(null)"
          title="클릭하면 대분류가 추가됩니다">＋ 대분류 추가</span></div>` : ''}</div>
  </div></div>`;
  drawLinks();
}

const LINE_COLORS = ['#b6cdb0', '#a9c8cb', '#aab4dd', '#c6cc9a', '#b6a8d4', '#cfc394', '#d8a8a2'];
function drawLinks() {
  const tree = document.querySelector('.tree');
  if (!tree) return;
  const svg = tree.querySelector('svg.links');
  const tr = tree.getBoundingClientRect();
  // 카드를 한 번만 훑어 위치를 모아둔다 (노드마다 querySelector + rect 하던 것을 제거)
  const box = new Map();
  for (const el of tree.querySelectorAll('.node-card[data-id]')) {
    const r = el.getBoundingClientRect();
    box.set(el.dataset.id, { l: r.left - tr.left, r: r.right - tr.left, m: r.top + r.height / 2 - tr.top });
  }
  const rootIdx = new Map();          // 소속 대분류 색인: 경로를 메모해 두 번 계산하지 않는다
  childrenOf(null).forEach((r, i) => rootIdx.set(r.id, i));
  const colorOf = n => {
    const chain = [];
    let cur = n;
    while (cur && !rootIdx.has(cur.id)) { chain.push(cur.id); cur = nodeById(cur.parent_id); }
    const i = cur ? rootIdx.get(cur.id) : 0;
    for (const id of chain) rootIdx.set(id, i);
    return LINE_COLORS[(i + LINE_COLORS.length) % LINE_COLORS.length];
  };
  const curve = (a, b, stroke, dash) => {
    const mx = (a.r + b.l) / 2;
    return `<path d="M ${a.r} ${a.m} C ${mx} ${a.m}, ${mx} ${b.m}, ${b.l} ${b.m}" stroke="${stroke}" stroke-width="2" fill="none"${dash}/>`;
  };
  const out = [];
  for (const n of nodes) {
    const b = box.get(String(n.id));
    const a = box.get(n.parent_id == null ? 'root' : String(n.parent_id));
    if (a && b) out.push(curve(a, b, colorOf(n), ''));
  }
  const ghost = box.get('ghost'), rootCard = box.get('root');
  if (ghost && rootCard) out.push(curve(rootCard, ghost, '#dcdcd6', ' stroke-dasharray="5 5"'));
  svg.setAttribute('width', tree.scrollWidth);
  svg.setAttribute('height', tree.scrollHeight);
  svg.innerHTML = out.join('');
}
window.addEventListener('resize', drawLinks);

// ---------- 디렉토리 뷰 가상 스크롤 ----------
let dirRows = [], dirTops = [], dirTotal = 0, DIR_ROW_H = 38, dirScrollAt = 0, dirTick = false;
const DIR_GROUP_EXTRA = 14;   // .dir-top 의 margin-top + padding-top + border
const DIR_BUFFER = 500;

function buildDirRows() {      // 보이는 줄만 평탄화 (접힘·필터 반영)
  dirRows = [];
  const walk = (entries, depth) => {
    for (const [n, num] of entries) {
      dirRows.push({ n, num, depth });
      if (!collapsed.has(n.id)) walk(shownChildren(n.id, num), depth + 1);
    }
  };
  walk(shownChildren(null, ''), 0);
  dirTops = []; let y = 0;
  dirRows.forEach((r, i) => {
    dirTops.push(y);
    y += DIR_ROW_H + (r.depth === 0 && i > 0 ? DIR_GROUP_EXTRA : 0);
  });
  dirTotal = y;
}

function dirRowHTML({ n, num, depth }, i) {
  const kids = shownChildren(n.id, num);
  const closed = collapsed.has(n.id);
  return `
      <div class="dir-item ${depth ? 'child' : ''} ${depth === 0 && i > 0 ? 'dir-top' : ''} ${n.id === selectedId ? 'selected' : ''}"
           data-id="${n.id}" style="margin-left:${depth * 22}px" onclick="select(${n.id})" title="더블클릭하면 하위를 모두 펼치거나 접습니다" ${DND(n.id)} ${DROP(n.id)}>
        ${kids.length
          ? `<button class="toggle" title="${closed ? '펼치기' : '접기'}"
               onclick="event.stopPropagation();toggleCollapse(${n.id})">${closed ? '▶' : '▼'}</button>`
          : '<span style="display:inline-block;width:11px"></span>'}
        ${GRIP}<span class="num">${num}</span>
        <span style="flex:1${depth ? '' : ';font-weight:600'}">${esc(n.title)}</span>${impSelect(n)}${MV(n.id)}
      </div>`;
}

function paintDirList() {
  const list = document.querySelector('.dir-list');
  if (!list) return;
  const probe = list.querySelector('.dir-item:not(.dir-ghost)');
  if (probe) DIR_ROW_H = probe.getBoundingClientRect().height || DIR_ROW_H;
  buildDirRows();
  const keep = list.scrollTop;
  dirScrollAt = keep;
  const winTop = keep - DIR_BUFFER, winBot = keep + list.clientHeight + DIR_BUFFER;
  let from = dirRows.length, to = 0;
  for (let i = 0; i < dirRows.length; i++) {
    if (dirTops[i] + DIR_ROW_H < winTop || dirTops[i] > winBot) continue;
    if (i < from) from = i;
    to = i + 1;
  }
  const addRow = canEdit()
    ? `<div class="dir-item dir-ghost" onclick="addNode(null)" title="클릭하면 대분류가 추가됩니다">＋ 대분류 추가</div>`
    : '';
  if (!dirRows.length) {
    list.innerHTML = `<p style="color:#aaa;padding:12px 10px">${filterOn() ? '선택한 중요도에 해당하는 항목이 없습니다.' : ''}</p>` + addRow;
    return;
  }
  const padTop = dirTops[from] || 0;
  const padBot = Math.max(0, dirTotal - (dirTops[to - 1] + DIR_ROW_H));
  list.innerHTML = `<div style="height:${padTop}px"></div>`
    + dirRows.slice(from, to).map((r, k) => dirRowHTML(r, from + k)).join('')
    + `<div style="height:${padBot}px"></div>` + addRow;
  list.scrollTop = keep;
}

function onDirScroll(list) {
  if (dirTick) return;
  if (Math.abs(list.scrollTop - dirScrollAt) < DIR_BUFFER / 2) return;
  dirTick = true;
  requestAnimationFrame(() => { dirTick = false; if (view === 'dir' && tab === 'spec' && project) paintDirList(); });
}

function renderDir(c) {
  const sel = nodeById(selectedId);
  const detail = sel ? detailBody(sel, false)
    : '<p style="color:#aaa;margin-top:40px">왼쪽 목록에서 항목을 선택하세요.</p>';
  c.innerHTML = `<div class="dir"><div class="dir-list" ${DROP(null)} title="빈 곳에 드롭하면 대분류가 됩니다"></div><div class="dir-detail">${detail}</div></div>`;
  dirDetailStamp = sel ? detailStamp(sel) : 'none';
  const list = c.querySelector('.dir-list');
  list.scrollTop = dirScrollAt;
  list.onscroll = () => onDirScroll(list);
  paintDirList();
  if (sel) loadComments(sel.id);
}

let panelStamp = '';
const detailStamp = n => [n.id, n.title, n.status, n.importance, n.description,
                          commentCache.has(n.id) ? (commentCache.get(n.id) || []).length : -1].join('|');
function renderPanel() {
  const p = document.getElementById('panel');
  const n = nodeById(selectedId);
  if (!n) { p.classList.remove('open'); panelStamp = ''; return; }
  const stamp = detailStamp(n);
  if (panelStamp === stamp && p.classList.contains('open')) return;   // 바뀐 게 없으면 그대로 둔다
  p.classList.add('open');
  p.innerHTML = detailBody(n, true);
  panelStamp = stamp;
  loadComments(n.id);
}

// rendered detail shared by the tree side panel and the directory pane
function detailBody(n, withClose) {

    <h1 title="더블클릭하여 수정" ondblclick="editField(this,${n.id},'title')">${esc(n.title)}</h1>
    <div class="meta">
      <span>ID N-${String(n.id).padStart(4, '0')}</span>
      <select class="pill-select" onchange="saveField(${n.id},'status',this.value)">
        ${STATUSES.map(s => `<option ${s === n.status ? 'selected' : ''}>${s}</option>`).join('')}</select>
      <select class="pill-select" onchange="saveField(${n.id},'importance',+this.value)">
        ${MOSCOW.map(m => `<option value="${m.v}" ${m.v === n.importance ? 'selected' : ''}>${m.ko} (${m.en})</option>`).join('')}</select>
    </div>
    <hr class="sep">
    <div class="desc-md" title="더블클릭하여 수정" ondblclick="descClick(event,this,${n.id})">
      ${md(n.description) || '<p class="ph">설명이 없습니다. 클릭하여 작성하세요.</p>'}</div>
    <div class="btnrow">
      ${canAddChild(n) && canEdit() ? `<button class="btn" onclick="addNode(${n.id})">+ 하위 추가</button>` : ''}
      <button class="btn danger" title="하위 항목까지 삭제됩니다"
        onclick="twoStep('node:${n.id}', () => removeNode(${n.id}))" ${canEdit() ? '' : 'hidden'}>${askLabel('node:' + n.id, '삭제')}</button>
      ${withClose ? `<button class="btn" onclick="closePanel()">닫기</button>` : ''}
    </div>
    <h3 style="margin:26px 0 6px;font-size:15px">코멘트</h3>
    <div id="cmts" style="margin-bottom:8px">${commentCache.has(n.id)
      ? commentsHTML(commentCache.get(n.id), n.id)
      : '<p style="color:#aaa;font-size:13px">불러오는 중…</p>'}</div>
    ${auth ? `<div style="display:flex;gap:6px">
        <input type="text" id="cmt-in" placeholder="코멘트를 입력하세요..."
          style="flex:1;padding:8px;border:1px solid #ddd;border-radius:6px"
          onkeydown="if(event.key==='Enter')addComment(${n.id})">
        <button class="btn primary" onclick="addComment(${n.id})">등록</button>
      </div>`
      : '<p style="color:#aaa;font-size:13px">코멘트를 작성하려면 로그인하세요.</p>'}
  </div>`;
}

// 링크는 브라우저가 열고, 용어는 용어 사전으로. 그 밖을 누르면 편집
function descClick(e, el, id) {
  if (!needEdit()) return;
  if (e.target.closest('a') || e.target.closest('.term')) return;
  editField(el, id, 'description');
}

// swap the rendered field for an editor in place; blur/Ctrl+Enter saves, Esc cancels
function editField(el, id, field) {
  if (!needEdit()) return;
  const n = nodeById(id);
  const multiline = field === 'description';
  const box = document.createElement(multiline ? 'textarea' : 'input');
  box.className = 'inline-edit' + (field === 'title' ? ' title-edit' : '');
  box.value = n[field];
  el.replaceWith(box);
  if (multiline) {
    const tools = document.createElement('div');
    tools.className = 'edtools';
    tools.innerHTML = '<span class="hint" style="margin:0">이미지는 붙여넣기(Ctrl+V)·끌어놓기로도 넣을 수 있습니다 · Ctrl+Enter 저장, Esc 취소</span>';
    box.after(tools);
    enableImages(box, tools);
  }
  box.focus();
  box.setSelectionRange(box.value.length, box.value.length);
  let done = false;
  // rerender=false: 다른 렌더링이 편집기를 걷어내며 발생한 blur (여기서 다시 그리면 DOM이 깨진다)
  const finish = (save, rerender = true) => {
    if (done) return;
    done = true;
    if (save && box.value !== n[field]) saveField(id, field, box.value);
    else if (rerender) render();
  };
  box.addEventListener('blur', () => { if (!pickingImage) finish(true, box.isConnected); });
  box.addEventListener('keydown', e => {
    if (e.key === 'Escape') finish(false);
    else if (e.key === 'Enter' && (!multiline || e.ctrlKey || e.metaKey)) { e.preventDefault(); finish(true); }
  });
}

async function saveField(id, field, value) {
  if (!needEdit()) return;
  await api('/api/nodes/' + id, { method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ [field]: value }) });
  setNodes(await reloadNodes());
  if (field === 'description') await loadTerms();
  render();
}

const commentCache = new Map();          // 노드별 코멘트. 작성·삭제할 때만 비운다
function commentsHTML(list, nodeId) {
  return list.length ? list.map(c => `
    <div style="display:flex;gap:8px;border-bottom:1px solid #f0f0ec;padding:8px 0">
      <span class="cmt-av">${avatarHTML(c.avatar, 26)}</span>
      <div style="flex:1;min-width:0">
        <div style="font-size:12px;color:#888">
          <b style="color:#666">${esc(c.username)}</b> · ${new Date(c.created_at).toLocaleString()}
          ${auth && auth.username === c.username
            ? `<button class="mv" style="font-size:12px" title="삭제" onclick="deleteComment(${c.id},${nodeId})">✕</button>` : ''}
        </div>
        <div style="font-size:14px;margin-top:2px;white-space:pre-wrap">${esc(c.content)}</div>
      </div>
    </div>`).join('')
    : '<p style="color:#aaa;font-size:13px">아직 코멘트가 없습니다.</p>';
}
async function loadComments(nodeId) {
  if (commentCache.has(nodeId)) return;   // 이미 화면에 그려져 있다 (detailBody 가 캐시로 렌더)
  const list = await api(`/api/nodes/${nodeId}/comments`).catch(() => []);
  commentCache.set(nodeId, list);
  const el = document.getElementById('cmts');
  if (!el || selectedId !== nodeId) return;
  el.innerHTML = commentsHTML(list, nodeId);
}
async function addComment(nodeId) {
  const input = document.getElementById('cmt-in');
  if (!input.value.trim()) return;
  try {
    await api(`/api/nodes/${nodeId}/comments`, { method: 'POST',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content: input.value }) });
    input.value = ''; commentCache.delete(nodeId); await loadComments(nodeId);
    const el = document.getElementById('cmts');
    if (el) el.innerHTML = commentsHTML(commentCache.get(nodeId) || [], nodeId);
  } catch (e) { toast(e.detail || '로그인이 필요합니다'); }
}
async function deleteComment(id, nodeId) {
  await api('/api/comments/' + id, { method: 'DELETE' }).catch(e => toast(e.detail || '삭제 실패'));
  commentCache.delete(nodeId); await loadComments(nodeId);
  const el = document.getElementById('cmts');
  if (el) el.innerHTML = commentsHTML(commentCache.get(nodeId) || [], nodeId);
}

let prdCaret = null;   // 편집 화면에서 커서를 놓을 위치

function renderPrd(c) {
  c.innerHTML = prdEditing
    ? `<div class="toolbar"><button class="btn primary" onclick="savePrd()">저장</button>
         <button class="btn" onclick="prdEditing=false;render()">취소</button></div>
       <textarea id="prd-edit">${esc(prdContent)}</textarea>
       <div class="edtools" id="prd-tools" style="max-width:820px;margin:0 auto"></div>`
    : `<div class="toolbar"><span class="hint" style="margin:0">본문을 더블클릭하면 그 자리에서 편집합니다</span></div>
       <div class="prd-doc" ondblclick="prdClickEdit(event)" title="더블클릭하여 수정">${md(prdContent)}</div>`;
  if (!prdEditing) return;
  const box = document.getElementById('prd-edit');
  enableImages(box, document.getElementById('prd-tools'));
  if (prdCaret == null) return;
  const at = Math.max(0, Math.min(prdCaret, box.value.length));
  prdCaret = null;
  box.focus();
  box.setSelectionRange(at, at);
  // 커서가 화면에 보이도록 스크롤
  const lh = parseFloat(getComputedStyle(box).lineHeight) || 22;
  const line = box.value.slice(0, at).split('\n').length - 1;
  box.scrollTop = Math.max(0, line * lh - box.clientHeight / 2);
}

// 클릭한 지점을 마크다운 원문 위치로 옮겨 편집 화면을 연다
function prdClickEdit(e) {
  if (!needEdit()) return;
  if (e.target.closest('a')) return;              // 링크는 브라우저가 열도록
  if (e.target.closest('.term')) return;          // 용어 클릭은 용어 사전
  const block = e.target.closest('p,h1,h2,h3,h4,h5,h6,li');
  let offset = 0;
  if (block) {
    // 클릭 지점까지의 글자 수 (블록 기준)
    let inBlock = 0;
    const pos = document.caretPositionFromPoint
      ? document.caretPositionFromPoint(e.clientX, e.clientY) : null;
    let node = pos && pos.offsetNode, nodeOffset = pos ? pos.offset : 0;
    if (!node && document.caretRangeFromPoint) {
      const r = document.caretRangeFromPoint(e.clientX, e.clientY);
      if (r) { node = r.startContainer; nodeOffset = r.startOffset; }
    }
    if (node && block.contains(node)) {
      const r = document.createRange();
      r.selectNodeContents(block);
      r.setEnd(node, nodeOffset);
      inBlock = r.toString().length;
    }
    const text = (block.textContent || '').trim();
    const idx = text ? prdContent.indexOf(text.slice(0, 40)) : -1;
    if (idx >= 0) offset = idx + inBlock;
  }
  prdCaret = offset;
  prdEditing = true;
  render();
}

// ---------- actions ----------
function setTab(t) { tab = t; render(); }
function setView(v) { view = v; render(); }
let lastCardClick = { id: 0, at: 0 };
function select(id) {
  const now = Date.now();
  if (lastCardClick.id === id && now - lastCardClick.at < 400) {   // 더블클릭 = 하위 전부 펼치기
    lastCardClick = { id: 0, at: 0 };
    return expandSubtree(id);
  }
  lastCardClick = { id, at: now };
  selectedId = selectedId === id ? null : id; applySelection();
}
function closePanel() { selectedId = null; applySelection(); }
// 선택만 바뀐 경우: 트리/목록 전체를 다시 만들지 않고 표시와 상세만 갱신한다
function applySelection() {
  if (!project || tab !== 'spec') return render();
  const on = document.querySelectorAll('.node-card.selected, .dir-item.selected');
  if (!on.length && selectedId == null) { /* 바뀔 것이 없다 */ }
  on.forEach(el => el.classList.remove('selected'));
  if (selectedId != null)
    document.querySelectorAll(`.node-card[data-id="${selectedId}"], .dir-item[data-id="${selectedId}"]`)
      .forEach(el => el.classList.add('selected'));
  if (view === 'tree') { renderPanel(); drawLinks(); }   // 패널 폭이 바뀌면 곡선도 다시 그린다
  else renderDirDetail();
}
let dirDetailStamp = '';
function renderDirDetail() {
  const box = document.querySelector('.dir-detail');
  if (!box) return render();
  const sel = nodeById(selectedId);
  const stamp = sel ? detailStamp(sel) : 'none';
  if (dirDetailStamp === stamp) return;
  dirDetailStamp = stamp;
  box.innerHTML = sel ? detailBody(sel, false)
    : '<p style="color:#aaa;margin-top:40px">왼쪽 목록에서 항목을 선택하세요.</p>';
  if (sel) loadComments(sel.id);
}
function toggleCollapse(id) { collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id); render(); }
const hasKids = id => childrenOf(id).length > 0;
const allParentIds = () => new Set(nodes.filter(n => hasKids(n.id)).map(n => n.id));
function collapseAll() { collapsed = allParentIds(); render(); }
// 더블클릭: 하위를 끝까지 펼친다. 이미 펼쳐져 있으면 반대로 모두 접는다
function expandSubtree(id) {
  if (!hasKids(id)) return;
  const ids = [id];
  const walk = pid => childrenOf(pid).forEach(k => { if (hasKids(k.id)) ids.push(k.id); walk(k.id); });
  walk(id);
  const fold = !collapsed.has(id);
  ids.forEach(i => fold ? collapsed.add(i) : collapsed.delete(i));
  render();
}
function expandAll() { collapsed = new Set(); render(); }

async function boot() {
  if (auth) {                      // 저장된 세션의 등급을 새로 받아온다 (관리자 메뉴 표시 판단)
    try {
      const m = await api('/api/me');
      profile = m;                 // 헤더 아이콘이 기본 아이콘으로 남지 않게 미리 채운다
      auth = { ...auth, role: m.role };
      localStorage.setItem('auth', JSON.stringify(auth));
      renderAuth();
    } catch (e) {
      if (String(e.message) === '401') { auth = null; localStorage.removeItem('auth'); renderAuth(); }
    }
  }
  if (shareToken) {
    try {
      project = await api('/api/shared/' + shareToken);
      await openProjectData();
      readViewParams();
    } catch (e) {
      // 링크가 만료·해제된 경우: 일반 화면으로 떨어뜨려 홈 버튼 등이 계속 동작하게 한다
      shareToken = null; invalidShare = true; project = null;
      history.replaceState(null, '', location.pathname);   // 쓸모없어진 share 파라미터 제거
      if (auth) await loadProjects();
    }
  } else {
    if (auth) await loadProjects();
    await applyRoute();
  }
  render();
}
const reloadNodes = () => api(`/api/projects/${project.slug}/nodes`);
async function addNode(parentId) {
  if (!needEdit()) return;
  const n = await api(`/api/projects/${project.slug}/nodes`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ parent_id: parentId, title: parentId ? '새 하위 기능' : '새 대분류' }) });
  setNodes(await reloadNodes());
  // 새 항목의 중요도가 필터에서 꺼져 있으면 보이도록 켜 준다
  if (filterOn() && !impFilter.has(n.importance)) {
    impFilter.add(n.importance);
    toast(`새 항목이 보이도록 '${moscow(n.importance).ko}' 필터를 켰습니다.`);
  }
  selectedId = n.id; collapsed.delete(parentId); render();
  // 생성 직후 제목을 바로 고칠 수 있게 편집 상태로 연다
  const h1 = document.querySelector((view === 'tree' ? '#panel' : '.dir-detail') + ' .detail h1');
  if (h1) { editField(h1, n.id, 'title'); document.querySelector('.inline-edit.title-edit')?.select(); }
}
async function removeNode(id) {
  if (!needEdit()) return;
  await api('/api/nodes/' + id, { method: 'DELETE' });
  if (selectedId === id) selectedId = null;
  setNodes(await reloadNodes()); await loadTerms(); render();
}
async function savePrd() {
  prdContent = document.getElementById('prd-edit').value;
  await api(`/api/projects/${project.slug}/prd`, { method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ content: prdContent }) });
  await loadTerms();
  prdEditing = false; render();
}

renderAuth();
boot();
</script>
