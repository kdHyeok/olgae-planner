// ---------- 표 설정: 이름 · 보기 · 속성 (PLAN 3.1) ----------
// 속성 타입 아이콘 — 표 설정에서 무엇을 고르는지 한눈에 (T 글자 · ¶ 문단 · ▾ 목록 · ☑ 체크 · ↗ 연결)
const TYPE_ICON = { text: 'T', md: '¶', select: '▾', checkbox: '☑', relation: '↗' };
const TYPE_LABEL = { text: 'T  한 줄 글', md: '¶  마크다운', select: '▾  선택',
                     checkbox: '☑  체크', relation: '↗  관련' };
// 작업 종류 아이콘. 사용자가 옵션 이름을 바꾸면 첫 글자를 쓴다
const KIND_ICON = { '작업': '●', '에픽': '◈', '이슈': '!', '버그': '!', '할일': '●' };
const kindIcon = v => KIND_ICON[v] || (v || '·').slice(0, 1);
const VIEW_LABEL = { document: '문서', table: '표', board: '칸반' };
let collEdit = null;      // { cid, title, view, board_by, schema: [...] }

function openCollSettings(cid) {
  if (!needEdit()) return;
  const k = collById(cid); if (!k) return;
  collEdit = {
    cid, title: k.title, view: k.view, board_by: k.board_by,
    schema: JSON.parse(JSON.stringify(k.schema || [])),
  };
  showModal(collSettingsHTML);
}
// 라벨에서 속성 key 를 만든다. 영문·숫자면 그대로, 아니면 p2·p3…
function keyFromLabel(label, taken) {
  let base = (label || '').toLowerCase().replace(/[^a-z0-9_]/g, '_').replace(/^_+|_+$/g, '');
  if (!/^[a-z]/.test(base)) base = '';
  let key = base || 'p';
  let i = 1;
  while (!key || taken.includes(key)) key = (base || 'p') + (++i);
  return key.slice(0, 30);
}
function collEditSet(i, field, value) {
  const p = collEdit.schema[i];
  if (field === 'options') p.options = value.split(',').map(x => x.trim()).filter(Boolean);
  else if (field === 'type') {
    p.type = value;
    if (value === 'select' && !(p.options || []).length) p.options = ['옵션1', '옵션2'];
    if (value !== 'select') delete p.options;
    if (value !== 'relation') delete p.target;
  } else p[field] = value;
  paintModal();
}
function collEditAdd() {
  const taken = collEdit.schema.map(x => x.key);
  collEdit.schema.push({ key: keyFromLabel('', taken), label: '새 속성', type: 'text' });
  paintModal();
}
function collEditDel(i) { collEdit.schema.splice(i, 1); paintModal(); }
function collEditMove(i, d) {
  const j = i + d;
  if (j < 0 || j >= collEdit.schema.length) return;
  [collEdit.schema[i], collEdit.schema[j]] = [collEdit.schema[j], collEdit.schema[i]];
  paintModal();
}
function collSettingsHTML() {
  const k = collById(collEdit.cid);
  const rows = (collItems.get(collEdit.cid) || []).length;
  const selects = collEdit.schema.filter(p => p.type === 'select');
  return `<h3 style="margin-bottom:6px">표 설정</h3>
    <p class="hint" style="margin:0 0 14px">속성을 지우면 <b>모든 행의 그 값도 사라집니다</b>.
      속성 key 는 한 번 만들면 바뀌지 않습니다(이름만 바뀝니다).</p>

    <div style="display:grid;grid-template-columns:1fr 120px 1fr;gap:8px;margin-bottom:14px">
      <label style="font-size:12px;color:#888">이름
        <input type="text" value="${esc(collEdit.title)}" oninput="collEdit.title=this.value"
          style="width:100%;padding:7px;border:1px solid #ddd;border-radius:6px;font-family:inherit"></label>
      <label style="font-size:12px;color:#888">보기
        <select onchange="collEdit.view=this.value;paintModal()"
          style="width:100%;padding:7px;border:1px solid #ddd;border-radius:6px;font-family:inherit">
          ${Object.entries(VIEW_LABEL).map(([v, l]) =>
            `<option value="${v}" ${v === collEdit.view ? 'selected' : ''}>${l}</option>`).join('')}</select></label>

// 셀을 그 자리에서 편집기로 바꾼다. blur/Ctrl+Enter 저장, Esc 취소 — editField 와 같은 감각
function editItemProp(e, el, iid, key) {
  if (!needEdit()) return;
  if (e && (e.target.closest('a') || e.target.closest('.term'))) return;   // 링크·용어 클릭은 그대로
  const it = findItem(iid); if (!it) return;
  const coll = collById(it._cid);
  const prop = (coll && coll.schema || []).find(x => x.key === key);
  const type = prop ? prop.type : (key === 'body' ? 'md' : 'text');
  const multiline = type === 'md';
  const cur = (it.props || {})[key];
  const initial = type === 'relation' ? (cur || []).map(seqLabel).join(', ') : (cur ?? '');
  const box = document.createElement(multiline ? 'textarea' : 'input');
  box.className = 'inline-edit' + (key === 'title' ? ' title-edit' : '') + (multiline ? ' md-edit' : '');
  box.value = initial;
  el.replaceWith(box);
  if (multiline) {
    const tools = document.createElement('div');
    tools.className = 'edtools';
    tools.innerHTML = '<span class="hint" style="margin:0">이미지는 붙여넣기(Ctrl+V)·끌어놓기로도 넣을 수 있습니다 · Ctrl+Enter 저장, Esc 취소</span>';
    box.after(tools);
    enableImages(box, tools);
  }
  box.focus();
  box.setSelectionRange(box.value.length, box.value.length);
  let done = false;
  const finish = (save, rerender = true) => {
    if (done) return;
    done = true;
    if (save && box.value !== initial) {
      let val = box.value;
      if (type === 'relation') {
        // "P1-14, 37" → [14, 37]. 앞의 키는 떼고 숫자만 받는다
        val = val.split(/[,\s]+/).map(t => t.replace(/^[A-Za-z0-9]+-/, '')).filter(Boolean)
          .map(Number).filter(n => Number.isInteger(n) && n > 0);
      }
      return setItemProp(iid, key, val);
    }
    if (rerender) render();
  };
  box.addEventListener('blur', () => finish(true, box.isConnected));
  box.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') finish(false);
    else if (ev.key === 'Enter' && (!multiline || ev.ctrlKey)) { ev.preventDefault(); finish(true); }
  });
}

// 칩 목록에서 ✕ 로 빼고, "+ 연결" 로 검색해 넣는다. 값은 번호(seq) 배열

function openChildPicker(iid) {

// 나와 내 위쪽 조상들은 하위가 될 수 없다(고리). 서버도 막지만 고를 수 없게 미리 거른다
function ancestorSeqs(k, seq) {
  const prop = selfRefProp(k);
  if (!prop) return new Set();
  const out = new Set();
  let cursor = seq, guard = 0;
  while (cursor != null && guard++ < 100) {
    const row = (collItems.get(k.id) || []).find(x => x.seq === cursor);
    const ups = row && ((row.props || {})[prop.key] || []);
    cursor = ups && ups.length ? ups[0] : null;
    if (cursor != null) out.add(cursor);
  }
  return out;
}
function descendantSeqs(k, seq) {
  const out = new Set();
  const walk = x => childrenOfItem(k, x).forEach(c => {
    if (out.has(c.seq)) return;
    out.add(c.seq); walk(c.seq);
  });
  walk(seq);
  return out;
}
function relPickQuery(v) {
  relPick.q = v;
  const box = document.getElementById('rel-list');
  if (box) box.innerHTML = relCandidatesHTML();
}
// 후보: 모든 노드 + 모든 행. target 이 지정된 속성이면 그 표만
function relCandidates() {
  const it = findItem(relPick.iid);
  const coll = it && collById(it._cid);
  const prop = (coll && coll.schema || []).find(x => x.key === relPick.key) || {};
  const q = relPick.q.trim().toLowerCase();
  const match = c => !q || String(c.seq).includes(q) || (c.title || '').toLowerCase().includes(q)
    || seqLabel(c.seq).toLowerCase().includes(q);
  let out = [];
  if (!prop.target && !relPick.child)
    out = nodes.filter(n => n.seq != null).map(n => ({ kind: 'node', seq: n.seq, title: n.title, group: '기능명세서' }));
  for (const [cid, arr] of collItems) {
    const k = collById(cid);
    if (prop.target && k.key !== prop.target) continue;
    out = out.concat(arr.map(x => ({ kind: 'item', seq: x.seq, title: itemTitle(x, k), group: k.title })));
  }
  // 자기 표를 가리키는 관계라면 고리가 될 후보를 뺀다
  if (it && coll && prop.target === coll.key) {
    const bad = new Set([it.seq,
      ...(relPick.child ? ancestorSeqs(coll, it.seq) : descendantSeqs(coll, it.seq))]);
    out = out.filter(c => !bad.has(c.seq));
  }
  return out.filter(match).slice(0, 60);
}
function relCandidatesHTML() {
  const it = findItem(relPick.iid);
  const coll0 = it && collById(it._cid);
  const cur = relPick.child
    ? childrenOfItem(coll0, it.seq).map(x => x.seq)
    : (((it || {}).props || {})[relPick.key] || []);
  const list = relCandidates();
  if (!list.length) return '<p style="color:#aaa;padding:12px 0">찾는 항목이 없습니다.</p>';
  return list.map(c => {
    const on = cur.includes(c.seq);
    return `<div class="pickrow ${on ? 'on' : ''}" ${on ? '' : `onclick="relAdd(${c.seq})"`}>
      <b style="font-family:ui-monospace,monospace;font-size:12px;color:#888">${esc(seqLabel(c.seq))}</b>
      <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis">${esc(c.title || '(제목 없음)')}</span>
      <span class="hint" style="margin:0">${esc(c.group)}</span>
      ${on ? '<span class="hint" style="margin:0">연결됨</span>' : ''}</div>`;
  }).join('');
}
async function relAdd(seq) {
  const it = findItem(relPick.iid); if (!it) return;
  if (relPick.child) { await addChild(relPick.iid, seq); paintModal(); return; }
  const cur = (it.props || {})[relPick.key] || [];
  if (cur.includes(seq)) return;
  await setItemProp(relPick.iid, relPick.key, [...cur, seq]);
  paintModal();
}
function relPickerHTML() {
  const it = findItem(relPick.iid);
  const coll = it && collById(it._cid);
  const prop = (coll && coll.schema || []).find(x => x.key === relPick.key) || { label: '관련' };
  const cur = ((it || {}).props || {})[relPick.key] || [];
  if (relPick.child) {
    const kids = childrenOfItem(coll, (it || {}).seq);
    return `<h3 style="margin-bottom:6px">하위 작업 추가</h3>
      <p class="hint" style="margin:0 0 12px">고른 항목의 <b>${esc(prop.label)}</b> 에 이 항목이 들어갑니다 —
        한쪽만 정하면 양쪽에 다 반영됩니다. 고리가 생기는 항목은 목록에 나오지 않습니다.</p>
      <div class="backrefs" style="margin:0 0 12px">${kids.length
        ? kids.map(x => `<span class="refchip item"><b>${esc(seqLabel(x.seq))}</b><span class="rt">${esc(itemTitle(x, coll))}</span>
            <span class="x" title="하위에서 빼기" onclick="removeChild(${relPick.iid},${x.seq})">✕</span></span>`).join('')
        : '<span class="hint" style="margin:0">아직 하위 작업이 없습니다.</span>'}</div>
      <input type="text" placeholder="번호나 제목으로 검색…" value="${esc(relPick.q)}"
        style="width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;margin-bottom:8px"
        oninput="relPickQuery(this.value)">
      <div id="rel-list" style="max-height:44vh;overflow:auto">${relCandidatesHTML()}</div>
      <div class="btnrow" style="margin-top:14px"><button class="btn" onclick="closeModal()">닫기</button></div>`;
  }
  return `<h3 style="margin-bottom:6px">${esc(prop.label)} 연결</h3>
    <p class="hint" style="margin:0 0 12px">${prop.target ? `<b>${esc((colls.find(c => c.key === prop.target) || {}).title || prop.target)}</b> 표의 행만 연결할 수 있습니다.` : '기능과 표의 행을 모두 연결할 수 있습니다.'}</p>
    <div class="backrefs" style="margin:0 0 12px">${cur.length
      ? cur.map(seq => `<span class="refchip ${(seqInfo(seq) || {}).kind === 'node' ? 'node' : 'item'}">
          <b>${esc(seqLabel(seq))}</b><span class="rt">${esc((seqInfo(seq) || {}).title || '')}</span>
          <span class="x" title="연결 해제" onclick="relRemove(${relPick.iid},'${relPick.key}',${seq})">✕</span></span>`).join('')
      : '<span class="hint" style="margin:0">아직 연결된 항목이 없습니다.</span>'}</div>
    <input type="text" placeholder="번호나 제목으로 검색…" value="${esc(relPick.q)}"
      style="width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;margin-bottom:8px"
      oninput="relPickQuery(this.value)">
    <div id="rel-list" style="max-height:44vh;overflow:auto">${relCandidatesHTML()}</div>
    <div class="btnrow" style="margin-top:14px"><button class="btn" onclick="closeModal()">닫기</button></div>`;
}

async function setItemProp(iid, key, value) {
  if (!needEdit()) return;
  const it = findItem(iid); if (!it) return;
  try {
    await api(`/api/items/${iid}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ props: { [key]: value } }) });
    await reloadItems(it._cid);
    if (itemView.iid === iid) itemView.events = await api(`/api/items/${iid}/events`).catch(() => []);
    render();
    if (!document.getElementById('modal').hidden) paintModal();
  } catch (err) { toast(err.detail || '저장 실패'); render(); }
}
async function addItem(cid, preset) {
  if (!needEdit()) return;
  const coll = collById(cid); if (!coll) return;
  // 고르는 값을 비워 두면 "미지정" 으로 떠서 헷갈린다. 첫 옵션을 기본값으로 넣는다
  const defaults = {};
  for (const c of coll.schema || [])
    if (c.type === 'select' && (c.options || []).length) defaults[c.key] = c.options[0];
  const props = { ...defaults, ...(coll.view === 'document' ? { title: '새 섹션', body: '' } : {}),
                  ...(preset || {}) };
  try {
    const it = await api(`/api/collections/${cid}/items`, { method: 'POST',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ props }) });
    await reloadItems(cid); render();
    // 만들자마자 제목(또는 첫 글 칸)을 편집 상태로
    const firstKey = coll.view === 'document' ? 'title'
      : ((coll.schema || []).find(x => x.type === 'text' || x.type === 'md') || {}).key;
    if (coll.view === 'board') { openItem(it.id); return; }
    const el = document.querySelector(`[data-item="${it.id}"] ${coll.view === 'document' ? '.sec-title' : '.text-cell, .md-cell'}`);
    if (el && firstKey) editItemProp(null, el, it.id, firstKey);
    scrollToColl(cid);
  } catch (err) { toast(err.detail || '추가 실패'); }
}
// ---------- 행 상세 모달: 속성 · 이력 · 코멘트 (PLAN 2.5·2.6·2.7) ----------
let itemView = { iid: null, events: [], comments: [], tab: 'detail' };

async function openItem(iid) {
  const it = findItem(iid); if (!it) return;
  itemView = { iid, events: [], comments: [], tab: 'detail' };
  showModal(itemHTML);
  [itemView.events, itemView.comments] = await Promise.all([
    api(`/api/items/${iid}/events`).catch(() => []),
    api(`/api/items/${iid}/comments`).catch(() => []),
  ]);
  paintModal();
}
function setItemTab(t) { itemView.tab = t; paintModal(); }
const propValueHTML = (it, c) => {
  const v = (it.props || {})[c.key], ro = canEdit() ? '' : 'disabled';
  switch (c.type) {
    // 고르는 값은 눌러서 바로 바꾼다 (예전에는 더블클릭해 글자로 고쳐야 했다)

      return `<input type="checkbox" ${v ? 'checked' : ''} ${ro}
        onchange="setItemProp(${it.id},'${c.key}',this.checked)">`;
    case 'md': return (v || '').trim() ? md(v) : '<span class="hint">—</span>';
    case 'relation': return (v || []).map(refChip).join(' ') || '<span class="hint">—</span>';
    default: return v ? esc(String(v)) : '<span class="hint">—</span>';
  }
};
// 자기 표를 가리키는 relation(상위 작업). 하위는 저장하지 않고 이걸 뒤집어 구한다
const selfRefProp = k => (k.schema || []).find(x => x.type === 'relation' && x.target === k.key);
function childrenOfItem(k, seq) {
  const prop = selfRefProp(k);
  if (!prop) return [];
  return (collItems.get(k.id) || []).filter(x => ((x.props || {})[prop.key] || []).includes(seq));
}
// 하위로 넣는다 = 그 행의 "상위 작업" 에 나를 적는다. 그래서 양쪽이 저절로 맞는다
async function addChild(parentIid, childSeq) {
  const parent = findItem(parentIid); if (!parent) return;
  const k = collById(parent._cid), prop = selfRefProp(k);
  const child = (collItems.get(k.id) || []).find(x => x.seq === childSeq);
  if (!child || !prop) return;
  await setItemProp(child.id, prop.key, [...new Set([...((child.props || {})[prop.key] || []), parent.seq])]);
}
async function removeChild(parentIid, childSeq) {
  const parent = findItem(parentIid); if (!parent) return;
  const k = collById(parent._cid), prop = selfRefProp(k);
  const child = (collItems.get(k.id) || []).find(x => x.seq === childSeq);
  if (!child || !prop) return;
  await setItemProp(child.id, prop.key, ((child.props || {})[prop.key] || []).filter(x => x !== parent.seq));
}
const evValue = v => v == null || v === '' ? '(비움)'
  : Array.isArray(v) ? v.map(x => seqLabel(x)).join(', ')
  : typeof v === 'boolean' ? (v ? '✓' : '✗')
  : String(v).length > 40 ? String(v).slice(0, 40) + '…' : String(v);

function itemHTML() {
  const it = findItem(itemView.iid);
  if (!it) return '<p>행을 찾을 수 없습니다.</p>';

        : '<p class="hint" style="padding:10px 0">아직 바뀐 기록이 없습니다.</p>')
    : t === 'comments'
    ? `<div style="margin-bottom:8px">${itemView.comments.length
          ? commentsHTML(itemView.comments, null) : '<p class="hint" style="padding:10px 0">코멘트가 없습니다.</p>'}</div>
       ${auth ? `<div style="display:flex;gap:6px">
         <input type="text" id="icmt-in" placeholder="코멘트를 입력하세요..."
           style="flex:1;padding:8px;border:1px solid #ddd;border-radius:6px"

         <button class="btn primary" onclick="addItemComment()">등록</button></div>`

    : (() => {
        const selfProp = selfRefProp(k);
        const kids = childrenOfItem(k, it.seq);
        // 종류는 맨 위에서 아이콘으로 고른다. 아래 목록에서는 뺀다
        const kindProp = cols.find(c => c.key === 'kind' && c.type === 'select');
        const rest = cols.filter(c => c !== kindProp);
        const kindBar = kindProp ? `<div class="kindbar">${(kindProp.options || []).map(o => `
          <button class="kindpick ${((it.props || {})[kindProp.key]) === o ? 'on' : ''}"
            ${canEdit() ? `onclick="setItemProp(${it.id},'${kindProp.key}','${o}')"` : 'disabled'}>
            <span class="ic">${esc(kindIcon(o))}</span>${esc(o)}</button>`).join('')}</div>` : '';
        return kindBar + `<dl class="idet" style="margin:0">${rest.map(c => `<dt>${esc(c.label)}</dt>
        <dd ${['relation', 'select', 'checkbox'].includes(c.type)
            ? ''
            : `ondblclick="editItemProp(event,this,${it.id},'${c.key}')" title="더블클릭하여 수정" style="cursor:text"`}>
          ${propValueHTML(it, c)}
          ${c.type === 'relation' && canEdit() ? `<button class="mv" title="연결 편집" onclick="openRelPicker(${it.id},'${c.key}')">＋</button>` : ''}
        </dd>`).join('')}
        ${selfProp ? `<dt>하위 작업</dt><dd>${kids.map(x => `
          <span class="refchip item"><b>${esc(seqLabel(x.seq))}</b><span class="rt">${esc(itemTitle(x, k))}</span>
            ${canEdit() ? `<span class="x" title="하위에서 빼기" onclick="removeChild(${it.id},${x.seq})">✕</span>` : ''}</span>`).join('')
          || '<span class="hint">—</span>'}
          ${canEdit() ? `<button class="mv" title="하위 작업 추가" onclick="openChildPicker(${it.id})">＋</button>` : ''}</dd>` : ''}
        </dl>${backrefsHTML(it.seq)}`;
      })();

  const tabBtn = (id, label, n) => `<button class="btn ${t === id ? 'primary' : ''}"
    style="padding:4px 12px;font-size:12px" onclick="setItemTab('${id}')">${label}${n ? ` ${n}` : ''}</button>`;
  return `<h3 style="margin-bottom:4px;display:flex;align-items:center;gap:8px">
      ${seqChip(it.seq)}<span>${esc(itemTitle(it, k)) || '(제목 없음)'}</span></h3>
    <p class="hint" style="margin:0 0 12px">${esc(k.title)}</p>
    <div style="display:flex;gap:6px;margin-bottom:12px">
      ${tabBtn('detail', '내용')}${tabBtn('events', '이력', itemView.events.length)}${tabBtn('comments', '코멘트', itemView.comments.length)}</div>
    ${body}
    <div class="btnrow" style="margin-top:16px">
      ${canEdit() ? `<button class="btn danger" onclick="twoStep('idel:${it.id}', () => { closeModal(); deleteItem(${it.id}); })">${askLabel('idel:' + it.id, '삭제')}</button>` : ''}
      <button class="btn" onclick="closeModal()">닫기</button></div>`;
}
async function addItemComment() {
  const box = document.getElementById('icmt-in');
  const text = (box.value || '').trim();
  if (!text) return;
  try {
    await api(`/api/items/${itemView.iid}/comments`, { method: 'POST',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content: text }) });

async function deleteItem(iid) {

  const it = findItem(iid); if (!it) return;
  try { await api(`/api/items/${iid}`, { method: 'DELETE' }); await reloadItems(it._cid); render(); }

// ---------- actions ----------
function setTab(t) { tab = t; render(); }
function setView(v) { view = v; render(); }
let lastCardClick = { id: 0, at: 0 };
function select(id) {
  const now = Date.now();
  if (lastCardClick.id === id && now - lastCardClick.at < 400) {   // 더블클릭 = 하위 전부 펼치기
    lastCardClick = { id: 0, at: 0 };
    return expandSubtree(id);
  }
  lastCardClick = { id, at: now };
  selectedId = selectedId === id ? null : id; applySelection();
}
function closePanel() { selectedId = null; applySelection(); }
// 선택만 바뀐 경우: 트리/목록 전체를 다시 만들지 않고 표시와 상세만 갱신한다
function applySelection() {
  if (!project || tab !== 'spec') return render();
  const on = document.querySelectorAll('.node-card.selected, .dir-item.selected');
  if (!on.length && selectedId == null) { /* 바뀔 것이 없다 */ }
  on.forEach(el => el.classList.remove('selected'));
  if (selectedId != null)
    document.querySelectorAll(`.node-card[data-id="${selectedId}"], .dir-item[data-id="${selectedId}"]`)
      .forEach(el => el.classList.add('selected'));
  if (view === 'tree') { renderPanel(); drawLinks(); }   // 패널 폭이 바뀌면 곡선도 다시 그린다
  else renderDirDetail();
}
let dirDetailStamp = '';
function renderDirDetail() {
  const box = document.querySelector('.dir-detail');
  if (!box) return render();
  const sel = nodeById(selectedId);
  const stamp = sel ? detailStamp(sel) : 'none';
  if (dirDetailStamp === stamp) return;
  dirDetailStamp = stamp;
  box.innerHTML = sel ? detailBody(sel, false)
    : '<p style="color:#aaa;margin-top:40px">왼쪽 목록에서 항목을 선택하세요.</p>';
  if (sel) loadComments(sel.id);
}
function toggleCollapse(id) { collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id); render(); }
const hasKids = id => childrenOf(id).length > 0;
const allParentIds = () => new Set(nodes.filter(n => hasKids(n.id)).map(n => n.id));
function collapseAll() { collapsed = allParentIds(); render(); }
// 더블클릭: 하위를 끝까지 펼친다. 이미 펼쳐져 있으면 반대로 모두 접는다
function expandSubtree(id) {
  if (!hasKids(id)) return;
  const ids = [id];
  const walk = pid => childrenOf(pid).forEach(k => { if (hasKids(k.id)) ids.push(k.id); walk(k.id); });
  walk(id);
  const fold = !collapsed.has(id);
  ids.forEach(i => fold ? collapsed.add(i) : collapsed.delete(i));
  render();
}
function expandAll() { collapsed = new Set(); render(); }

async function boot() {
  if (auth) {                      // 저장된 세션의 등급을 새로 받아온다 (관리자 메뉴 표시 판단)
    try {
      const m = await api('/api/me');
      profile = m;                 // 헤더 아이콘이 기본 아이콘으로 남지 않게 미리 채운다
      auth = { ...auth, id: m.id, login_id: m.login_id, display_name: m.display_name, role: m.role };
      localStorage.setItem('auth', JSON.stringify(auth));
      renderAuth();
    } catch (e) {
      if (String(e.message) === '401') { auth = null; localStorage.removeItem('auth'); renderAuth(); }
    }
  }
  if (shareToken) {
    try {
      project = await api('/api/shared/' + shareToken);
      await openProjectData();
      readViewParams();
      queueMicrotask(applyPendingSeq);
    } catch (e) {
      // 링크가 만료·해제된 경우: 일반 화면으로 떨어뜨려 홈 버튼 등이 계속 동작하게 한다
      shareToken = null; invalidShare = true; project = null;
      history.replaceState(null, '', location.pathname);   // 쓸모없어진 share 파라미터 제거
      if (auth) await loadProjects();
    }
  } else {
    if (auth) await loadProjects();
    await applyRoute();
  }
  render();
  applyPendingSeq();
}
const reloadNodes = () => api(`/api/projects/${project.slug}/nodes`);
async function addNode(parentId) {
  if (!needEdit()) return;
  const n = await api(`/api/projects/${project.slug}/nodes`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ parent_id: parentId, title: parentId ? '새 하위 기능' : '새 대분류' }) });
  setNodes(await reloadNodes());
  // 새 항목의 중요도가 필터에서 꺼져 있으면 보이도록 켜 준다
  if (filterOn() && !impFilter.has(n.importance)) {
    impFilter.add(n.importance);
    toast(`새 항목이 보이도록 '${moscow(n.importance).ko}' 필터를 켰습니다.`);
  }
  selectedId = n.id; collapsed.delete(parentId); render();
  // 생성 직후 제목을 바로 고칠 수 있게 편집 상태로 연다
  const h1 = document.querySelector((view === 'tree' ? '#panel' : '.dir-detail') + ' .detail h1');
  if (h1) { editField(h1, n.id, 'title'); document.querySelector('.inline-edit.title-edit')?.select(); }
}
async function removeNode(id) {
  if (!needEdit()) return;
  await api('/api/nodes/' + id, { method: 'DELETE' });
  if (selectedId === id) selectedId = null;
  setNodes(await reloadNodes()); await loadTerms(); render();
}

renderAuth();
boot();
</script>
