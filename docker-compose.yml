services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env 에 POSTGRES_PASSWORD 를 설정하세요}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app}"]
      interval: 2s
      timeout: 2s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-app}
      # /mcp 의 Host 검사(DNS 리바인딩 방어). 배포 시 도메인을 넣는다.
      #   MCP_ALLOWED_HOSTS=prd.example.com docker compose up -d
      # 콤마로 여러 개 지정 가능. 빈 값으로 두면 검사를 끈다.
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS-localhost:3000,127.0.0.1:3000}
      # OAuth issuer/resource의 외부 HTTPS 주소. 현재 운영 도메인은 별도 설정 없이 동작한다.
      PUBLIC_URL: ${PUBLIC_URL:-https://prd.donhse.duckdns.org}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  dbdata:
